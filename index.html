<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" sizes="32x32" href="Screenshot 2026-05-01 204517.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoPlanet</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root {
  --primary:#1e90ff; --success:#28a745; --warning:#ff9800;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,#0f2027,#000);color:#fff}
nav{display:flex;justify-content:space-between;align-items:center;padding:30px 32px;position:relative;z-index:2}
.logo{font-weight:700;font-size:19px;color:var(--primary)}

.globe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(90vw, 600px);
height: min(90vw, 600px);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  z-index: 0;

  background: url('eartt.png') repeat-x;
  background-size: cover;

  box-shadow:
    inset -40px -40px 80px rgba(0,0,0,0.7),
    0 0 80px rgba(70, 178, 255, 0.548);

  animation: rotateEarth 40s linear infinite;
}

@keyframes rotateEarth {
  from { background-position: 0 0; }
  to { background-position: 1000px 0; }
}


.hero {
  position: relative;
  overflow: hidden;

  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cursor-glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(0, 149, 255, 0.25), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 1;
}
.hero-content {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 900px; 
  margin: 0 auto;
  text-align: center;
}
.hero-content > div:last-child {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.hero h1{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 12px}
.hero p{opacity:.8;margin:0 0 18px}
.input-wrap{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
input{padding:12px;max-width:260px;width:100%;border-radius:8px;border:none}
button{padding:12px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
.generate{background:var(--primary)}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1;
}
.output {
  position: relative;
  display: flex;
  justify-content: center;
  flex-wrap: nowrap;

  max-width: 100%;
  overflow-x: auto;

  margin-top: 30px;
  padding: 10px;
}
button:hover {
  filter: brightness(1.1);
}
input:focus {
  outline: none;
  box-shadow: 0 0 10px rgba(30,144,255,0.6);
}
.hero h1, .hero p {
  text-align: center;
  width: 100%;
}
#output {
  width: 100%;
  max-width: 100%;
}
.output::-webkit-scrollbar {
  display: none;
}input {
  flex: 1;
}

button:active {
  transform: scale(0.95);
}

.download, .share, .copy {
  display: none;
}
.clear {
  background: #444;
  color: #fff;
}

.clear:hover {
  background: #666;
}
.output img {
  width: clamp(30px, 8vw, 90px);
  height: clamp(30px, 8vw, 90px);
  margin:2px;
}
    @media (max-width: 600px) {
  .output img {
    width: clamp(45px, 12vw, 80px);
    height: clamp(45px, 12vw, 80px);
  }
}
@keyframes pop{to{transform:scale(1)}}

.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:40px 16px}
.card{background:rgba(255,255,255,.05);padding:20px;border-radius:14px}
.footer{text-align:center;padding:20px;opacity:.6;font-size:15px;color:#ffffff;}
</style>
</head>
<body>

<nav>
  <div class="logo">GeoPlanet </div>
</nav>
   
<section class="hero">



  <div class="globe"></div>
<div class="cursor-glow"></div>
  <div class="hero-content">
    <h1>See Your Name Written by Earth</h1>
    <p>Generate satellite-style names & numbers instantly</p>

    <div class="input-wrap">
      <input id="textInput" placeholder="Enter your name / 2026" maxlength="25"/>
      <button class="generate" onclick="generate()">Generate</button>
        <button class="clear" onclick="clearAll()">Clear</button>
    </div>

    <div id="output" class="output"></div>

    <div style="margin-top:10px">
      <button class="download" id="downloadBtn" onclick="downloadImage()">Download</button>
      <button class="share" id="shareBtn" onclick="shareImage()">Share</button>
      <button class="copy" id="copyBtn" onclick="copyLink()">Copy Link</button>
    </div>
  </div>
</section>



<div class="footer">Crafted by VVNSSK 🌍</div>

<script>
const map={
  A:["a-0.png","a-1.png","a-2.png","a-3.png"],
  B:["b-1.png"],
  C:["c-2.png"],
  D:["d-0.png","d-1.png"],
  E:["e-1.png","e-0.png","e-2.png"],
  F:["f-1.png"],
  G:["g-0.png"],
  H:["h-0.png"],
  I:["i-0.png","i-1.png","i-2.png"],
  J:["j-0.png","j-1.png","j-2.png"],
  K:["k-0.png","k-1.png"],
  L:["l-0.png"],
  M:["m-1.png","m-2.png"],
  N:["n-0.png","n-1.png"],
  O:["o-0.png","o-1.png"],
  P:["p-0.png","p-1.png"],
  Q:["q-0.png"],
  R:["r-0.png","r-1.png","r-2.png"],
  S:["s-0.png","s-1.png"],
  T:["t-0.png"],
  U:["u-0.png"],
  V:["v-0.png","v-1.png","v-2.png"],
  W:["w-0.png","w-1.png"],
  X:["x-0.png","x-1.png"],
  Y:["y-0.png","y-1.png","y-2.png"],
  Z:["z.png"],
  0:["0.png"],1:["1.png"],2:["2.png"],3:["3.png"],
  4:["4.png"],5:["5.png"],6:["6.png"],7:["7.png"],
  8:["8.png"],9:["9.png"]
};


let glow;

window.onload = () => {
  glow = document.querySelector(".cursor-glow");
  document.getElementById("textInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") generate();
});
toggleBtns(false);
  animateGlow();
};
let mouseX = 0, mouseY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});


function animateGlow(){
if(!glow) return requestAnimationFrame(animateGlow);
  glow.style.left = mouseX + "px";
  glow.style.top = mouseY + "px";
  requestAnimationFrame(animateGlow);
}



function rand(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function clearAll(){
  document.getElementById("textInput").value = "";
  document.getElementById("output").innerHTML = "";

  toggleBtns(false);

  // remove query param from URL
  const url = new URL(window.location);
  url.searchParams.delete("q");
  history.replaceState(null, "", url);
}
function render(input){
  const out = document.getElementById("output");
  out.innerHTML = '';

  const length = input.length;

  // 🎯 dynamic sizing
  let size;
  if (window.innerWidth < 600) {
    // mobile sizes
    if (length <= 4) size = 80;
    else if (length <= 8) size = 65;
    else if (length <= 15) size = 50;
    else size = 40;
  } else {
    // desktop sizes
    if (length <= 4) size = 90;
    else if (length <= 8) size = 70;
    else if (length <= 15) size = 55;
    else size = 45;
  }

  input.split("").forEach((c,i)=>{
    if(c === " "){
      const spacer = document.createElement("div");
      spacer.style.width = "15px";
      out.appendChild(spacer);
      return;
    }

    if(map[c]){
      const img = document.createElement("img");
      img.src = rand(map[c]);

      img.style.width = size + "px";
      img.style.height = size + "px";

      img.style.animationDelay = `${i * 0.1}s`;

      img.onerror = () => img.remove();
      out.appendChild(img);
    }
  });
}

function generate(){
  const input=document.getElementById("textInput").value.trim().toUpperCase();

  if(!input) return;

  if(input.length > 25){
    alert("Max 25 characters allowed 🚫");
    return;
  }

  const out = document.getElementById("output");
  out.innerHTML = "<p style='opacity:0.6'>Generating...</p>";

  setTimeout(()=>{
    render(input);

    requestAnimationFrame(() => {
      out.scrollLeft = (out.scrollWidth - out.clientWidth) / 2;
    });

    toggleBtns(true);
    updateURL(input);
  }, 200);
}


function toggleBtns(show){
  ["downloadBtn","shareBtn","copyBtn"].forEach(id=>{
    document.getElementById(id).style.display=show?"inline-block":"none";
  });
}

function downloadImage(){
  const node = document.getElementById("output");

  html2canvas(node, {
    scale: 3,
    useCORS: true,
    backgroundColor: "#000",
    scrollX: 0,
    scrollY: -window.scrollY,
    logging: false
  }).then(canvas => {
    const a = document.createElement("a");
    a.download = "geoplanet.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
}

function shareImage(){
  html2canvas(document.getElementById("output"), {
  scale: 3,
  useCORS: true,
  backgroundColor: "#000",
  logging: false
}).then(c=>{
    c.toBlob(b=>{
      const f=new File([b],"geoplanet.png",{type:"image/png"});

      if(navigator.share){
        navigator.share({
          title:"GeoPlanet 🌍",
          text:"Check this out!",
          files:[f]
        });
      } else {
        // fallback
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "geoplanet.png";
        a.click();
        alert("Downloaded instead (sharing not supported)");
      }
    });
  });
}

// shareable URL
function updateURL(text){
  const url=new URL(window.location);
  url.searchParams.set("q",text);
  history.replaceState(null,"",url);
}

function loadFromURL(){
  const p=new URLSearchParams(window.location.search);
  const q=p.get("q");
  if(q){
    document.getElementById("textInput").value=q;
    generate();
  }
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied!");
}

loadFromURL();

</script>

</body>
</html>
