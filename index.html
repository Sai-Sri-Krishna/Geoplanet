<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" sizes="32x32" href="Screenshot 2026-05-01 204517.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoPlanet</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
:root {
  --primary:#1e90ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top,#0f2027,#000);
  color: #fff;
}

nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:30px;
}

.logo {
  font-weight:700;
  font-size:19px;
  color:var(--primary);
}

.hero {
  position: relative;
  min-height: 100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.globe {
  position:absolute;
  top:50%;
  left:50%;
  width:min(90vw,600px);
  height:min(90vw,600px);
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:url('eartt.png') repeat-x;
  background-size:cover;
  box-shadow:
    inset -40px -40px 80px rgba(0,0,0,0.7),
    0 0 80px rgba(70,178,255,0.5);
  animation: rotateEarth 40s linear infinite;
  z-index:0;
}

@keyframes rotateEarth {
  from { background-position: 0 0; }
  to { background-position: 1000px 0; }
}

.hero-content {
  position:relative;
  z-index:2;
  text-align:center;
  width:100%;
  max-width:900px;
}

.input-wrap {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

input {
  padding:12px;
  border-radius:8px;
  border:none;
  max-width:260px;
  width:100%;
}

button {
  padding:12px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.generate {
  background:var(--primary);
  color:#fff;
}

.clear {
  background:#444;
  color:#fff;
}

.clear:hover {
  background:#666;
}

.output {
  margin-top:25px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:4px;
  padding:10px;
}

.output img {
  width: clamp(35px, 8vw, 85px);
  height: clamp(35px, 8vw, 85px);
  margin:2px;
  object-fit:cover;
  transition:0.2s;
}

.output img:hover {
  transform: scale(1.1);
}

.download,.share,.copy {
  display:none;
  margin-top:10px;
}

.footer {
  text-align:center;
  padding:20px;
  opacity:.6;
}
</style>
</head>

<body>

<nav>
  <div class="logo">GeoPlanet</div>
</nav>

<section class="hero">
  <div class="globe"></div>

  <div class="hero-content">

    <h1>See Your Name Written by Earth</h1>
    <p>Generate satellite-style names & numbers instantly</p>

    <div class="input-wrap">
      <input id="textInput" placeholder="Enter your name / 2026" maxlength="25"/>
      <button class="generate" onclick="generate()">Generate</button>
      <button class="clear" onclick="clearAll()">Clear</button>
    </div>

    <div id="output" class="output"></div>

    <div>
      <button class="download" id="downloadBtn" onclick="downloadImage()">Download</button>
      <button class="share" id="shareBtn" onclick="shareImage()">Share</button>
      <button class="copy" id="copyBtn" onclick="copyLink()">Copy Link</button>
    </div>

  </div>
</section>

<div class="footer">Crafted by VVNSSK 🌍</div>

<script>

const map = {
  A:["a-0.png","a-1.png","a-2.png","a-3.png"],
  B:["b-1.png"],
  C:["c-2.png"],
  D:["d-0.png","d-1.png"],
  E:["e-1.png","e-0.png","e-2.png"],
  F:["f-1.png"],
  G:["g-0.png"],
  H:["h-0.png"],
  I:["i-0.png","i-1.png","i-2.png"],
  J:["j-0.png","j-1.png","j-2.png"],
  K:["k-0.png","k-1.png"],
  L:["l-0.png"],
  M:["m-1.png","m-2.png"],
  N:["n-0.png","n-1.png"],
  O:["o-0.png","o-1.png"],
  P:["p-0.png","p-1.png"],
  Q:["q-0.png"],
  R:["r-0.png","r-1.png","r-2.png"],
  S:["s-0.png","s-1.png"],
  T:["t-0.png"],
  U:["u-0.png"],
  V:["v-0.png","v-1.png","v-2.png"],
  W:["w-0.png","w-1.png"],
  X:["x-0.png","x-1.png"],
  Y:["y-0.png","y-1.png","y-2.png"],
  Z:["z.png"],
  0:["0.png"],1:["1.png"],2:["2.png"],3:["3.png"],
  4:["4.png"],5:["5.png"],6:["6.png"],7:["7.png"],
  8:["8.png"],9:["9.png"]
};

function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function render(input){
  const out = document.getElementById("output");
  out.innerHTML = "";

  let size = window.innerWidth < 600 ? 60 : 80;

  input.split("").forEach(c=>{
    if(c === " ") {
      const sp = document.createElement("div");
      sp.style.width = "15px";
      out.appendChild(sp);
      return;
    }

    if(map[c]){
      const img = document.createElement("img");
      img.src = rand(map[c]);
      img.style.width = size + "px";
      img.style.height = size + "px";
      out.appendChild(img);
    }
  });
}

function generate(){
  const input = document.getElementById("textInput").value.trim().toUpperCase();
  if(!input) return;

  if(input.length > 25){
    alert("Max 25 characters allowed 🚫");
    return;
  }

  document.getElementById("output").innerHTML = "<p>Generating...</p>";

  setTimeout(()=>{
    render(input);
    toggleBtns(true);
    updateURL(input);
  }, 200);
}

function clearAll(){
  document.getElementById("textInput").value="";
  document.getElementById("output").innerHTML="";
  toggleBtns(false);
}

function toggleBtns(show){
  ["downloadBtn","shareBtn","copyBtn"].forEach(id=>{
    document.getElementById(id).style.display = show ? "inline-block" : "none";
  });
}

function downloadImage(){
  html2canvas(document.getElementById("output"), {
    scale:3,
    backgroundColor:"#000"
  }).then(canvas=>{
    const a=document.createElement("a");
    a.download="geoplanet.png";
    a.href=canvas.toDataURL();
    a.click();
  });
}

function shareImage(){
  html2canvas(document.getElementById("output"), {
    scale:3,
    backgroundColor:"#000"
  }).then(canvas=>{
    canvas.toBlob(blob=>{
      const file=new File([blob],"geoplanet.png",{type:"image/png"});

      if(navigator.share){
        navigator.share({
          title:"GeoPlanet",
          files:[file]
        });
      }
    });
  });
}

function updateURL(text){
  const url=new URL(window.location);
  url.searchParams.set("q",text);
  history.replaceState(null,"",url);
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied!");
}

</script>

</body>
</html>
